# =============================================================================
# Continuous Deployment -- GCP Financial Data Platform
# =============================================================================
# Triggered manually via workflow_dispatch. Builds container images, pushes
# them to Artifact Registry, plans Terraform changes for the chosen
# environment root (terraform/environments/<env>), and runs dbt against the
# fdp_<env>_* datasets.
#
# Terraform apply is intentionally NOT automated -- the plan is uploaded as an
# artifact. A human must review and run apply.
#
# Environments map 1:1 to terraform/environments/ and dbt profile targets:
#   dev  - local Terraform backend (no state bucket), dbt target dev
#   prod - GCS backend; bucket/prefix supplied via -backend-config from the
#          TF_STATE_BUCKET secret, dbt target prod
#
# Required repository secrets:
#   GCP_PROJECT_ID                 - GCP project to plan/deploy against
#   GCP_WORKLOAD_IDENTITY_PROVIDER - Workload Identity pool provider
#   GCP_SERVICE_ACCOUNT_EMAIL      - SA email for Workload Identity
#   ARTIFACT_REGISTRY_REPO         - e.g. us-central1-docker.pkg.dev/project/repo
#   GCP_REGION                     - e.g. us-central1
#   TF_STATE_BUCKET                - GCS bucket for prod Terraform state
# =============================================================================

name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (terraform/environments/<env>, dbt target <env>)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: cd-main
  cancel-in-progress: false          # never cancel a deploy mid-flight

permissions:
  contents: read
  id-token: write                    # required for Workload Identity Federation

# ---------------------------------------------------------------------------
# Build container images and push to Artifact Registry
# ---------------------------------------------------------------------------
jobs:
  build-and-push:
    name: "Build & push container images"
    runs-on: ubuntu-latest
    outputs:
      ingestion_image: ${{ steps.meta.outputs.ingestion_image }}
      governance_image: ${{ steps.meta.outputs.governance_image }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image tags
        id: meta
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          REPO="${{ secrets.ARTIFACT_REGISTRY_REPO }}"
          echo "ingestion_image=${REPO}/ingestion-service:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "governance_image=${REPO}/governance-service:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build & push ingestion-service
        uses: docker/build-push-action@v7
        with:
          context: ./ingestion-service
          push: true
          tags: |
            ${{ secrets.ARTIFACT_REGISTRY_REPO }}/ingestion-service:${{ steps.meta.outputs.short_sha }}
            ${{ secrets.ARTIFACT_REGISTRY_REPO }}/ingestion-service:latest
          cache-from: type=gha,scope=ingestion
          cache-to: type=gha,scope=ingestion,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build & push governance-service
        uses: docker/build-push-action@v7
        with:
          context: ./governance
          push: true
          tags: |
            ${{ secrets.ARTIFACT_REGISTRY_REPO }}/governance-service:${{ steps.meta.outputs.short_sha }}
            ${{ secrets.ARTIFACT_REGISTRY_REPO }}/governance-service:latest
          cache-from: type=gha,scope=governance
          cache-to: type=gha,scope=governance,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ---------------------------------------------------------------------------
  # Terraform -- plan only (manual approval required for apply)
  # ---------------------------------------------------------------------------
  terraform-plan:
    name: "Terraform: plan (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    needs: build-and-push
    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      # environments/dev uses a local backend, so it takes no backend config.
      # environments/prod declares a gcs backend whose bucket comes from the
      # TF_STATE_BUCKET secret (overriding the placeholder in main.tf).
      - name: Terraform init
        env:
          TARGET_ENV: ${{ inputs.environment }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          BACKEND_ARGS=()
          if [ "$TARGET_ENV" = "prod" ]; then
            BACKEND_ARGS+=(-backend-config="bucket=${TF_STATE_BUCKET}")
            BACKEND_ARGS+=(-backend-config="prefix=financial-data-platform/prod")
          fi
          terraform init "${BACKEND_ARGS[@]}" -input=false

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="artifact_registry_repo=${{ secrets.ARTIFACT_REGISTRY_REPO }}" \
            -var="image_tag=${{ needs.build-and-push.outputs.short_sha }}" \
            -out=tfplan \
            -input=false \
            -detailed-exitcode \
            2>&1 | tee plan_output.txt
          rc=${PIPESTATUS[0]}
          echo "exitcode=${rc}" >> "$GITHUB_OUTPUT"
          # -detailed-exitcode: 0 no changes, 2 changes present, 1 error
          [ "${rc}" -ne 1 ]
        continue-on-error: true

      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: |
            terraform/environments/${{ inputs.environment }}/tfplan
            terraform/environments/${{ inputs.environment }}/plan_output.txt
          retention-days: 30

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------------------
  # dbt -- deploy to staging
  # ---------------------------------------------------------------------------
  deploy-dbt:
    name: "dbt: deploy (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    needs: build-and-push
    defaults:
      run:
        working-directory: dbt_project
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: pip install dbt-bigquery

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true

      # dataset is the fdp_<env> prefix; dbt appends _staging / _marts_* / _seeds
      # (dbt_project.yml). Terraform provisions all but the seeds dataset.
      - name: Configure dbt profile
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<PROFILES
          financial_data_platform:
            target: ${TARGET_ENV}
            outputs:
              ${TARGET_ENV}:
                type: bigquery
                method: service-account
                project: ${GCP_PROJECT_ID}
                dataset: fdp_${TARGET_ENV}
                keyfile: ${GOOGLE_APPLICATION_CREDENTIALS}
                location: ${GCP_REGION}
                threads: 8
                timeout_seconds: 600
                priority: interactive
                retries: 1
          PROFILES

      - name: dbt deps
        run: dbt deps

      - name: dbt seed
        run: dbt seed --target ${{ inputs.environment }}

      - name: dbt run
        run: dbt run --target ${{ inputs.environment }} --full-refresh

      - name: dbt test
        run: dbt test --target ${{ inputs.environment }}

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-artifacts
          path: |
            dbt_project/target/manifest.json
            dbt_project/target/run_results.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Secret scanning -- full history
  # ---------------------------------------------------------------------------
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
