name: financial_data_platform
version: '1.0.0'
config-version: 2
profile: financial_data_platform

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages
  - logs

vars:
  start_date: '2025-01-01'
  end_date: '2025-03-31'

# Dataset naming: fdp_<env>_<layer>. The profile's dataset is fdp_<env>; each
# +schema below is the <layer> suffix dbt appends to it (default
# generate_schema_name behaviour), matching terraform/modules/bigquery.
models:
  financial_data_platform:
    staging:
      +materialized: view
      +schema: staging # -> fdp_<env>_staging
    intermediate:
      +materialized: ephemeral # no dataset: compiled into the marts
    marts:
      finance:
        +materialized: table
        +schema: marts_finance # -> fdp_<env>_marts_finance
      analytics:
        +materialized: table
        +schema: marts_analytics # -> fdp_<env>_marts_analytics

seeds:
  financial_data_platform:
    +schema: seeds # -> fdp_<env>_seeds
